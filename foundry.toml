[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = false
bytecode_hash = "none"
ffi = false
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./ts/test" },
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 2048
depth = 128

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
