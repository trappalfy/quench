<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7 7" shape-rendering="crispEdges">
  <!-- A pixel Q in the tile grammar, carrying the one gradient this product is
       named for: amber on the left, cyan on the right. At 16px the letterform
       is what survives; the colour is what makes it ours. -->
  <defs>
    <linearGradient id="q" x1="0" y1="0" x2="7" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="7" height="7" fill="#0c0d0f"/>
  <g fill="url(#q)">
    <rect x="1" y="0" width="5" height="1"/>
    <rect x="0" y="1" width="1" height="4"/>
    <rect x="6" y="1" width="1" height="4"/>
    <rect x="1" y="6" width="4" height="1"/>
    <rect x="0" y="5" width="1" height="1"/>
    <rect x="5" y="5" width="1" height="1"/>
    <rect x="3" y="4" width="1" height="1"/>
    <rect x="4" y="5" width="1" height="1"/>
    <rect x="6" y="6" width="1" height="1"/>
  </g>
</svg>
